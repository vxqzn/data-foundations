services:
  warehouse:
    image: postgres:18-alpine
    container_name: insse_warehouse
    environment:
      POSTGRES_DB: insse_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insse_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local